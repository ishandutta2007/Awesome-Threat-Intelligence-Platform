<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Glowing Cyber Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#7928ca;#ff0080;#00f0ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7928ca">
        <animate attributeName="stop-color" values="#7928ca;#ff0080;#00f0ff;#7928ca" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00ffaa">
        <animate attributeName="stop-color" values="#00ffaa;#00f0ff;#7928ca;#00ffaa" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Title Glow Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="40%" stop-color="#70a6ff" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00ffcc" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="90%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Animated Radar Pulse -->
    <style>
      @keyframes pulseRing {
        0% { r: 10px; opacity: 0.8; }
        50% { opacity: 0.4; }
        100% { r: 130px; opacity: 0; }
      }
      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes floatEffect {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes cyberScan {
        0% { transform: translateY(-50px); opacity: 0; }
        20% { opacity: 0.6; }
        80% { opacity: 0.6; }
        100% { transform: translateY(380px); opacity: 0; }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.4); }
      }
      .ring1 { animation: pulseRing 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      .ring2 { animation: pulseRing 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 2s; }
      .radarArm { transform-origin: 1020px 180px; animation: radarRotate 6s linear infinite; }
      .floatingCard { animation: floatEffect 5s ease-in-out infinite; }
      .scanLine { animation: cyberScan 5s linear infinite; }
      .blinkingDot1 { animation: blinkDot 2s ease-in-out infinite; }
      .blinkingDot2 { animation: blinkDot 2.5s ease-in-out infinite 0.8s; }
      .blinkingDot3 { animation: blinkDot 1.8s ease-in-out infinite 1.4s; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Cyber Grid Pattern -->
  <g stroke="#1a2744" stroke-width="0.8" opacity="0.45">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="320" x2="1200" y2="320" />

    <line x1="60" y1="0" x2="60" y2="360" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="180" y1="0" x2="180" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="420" y1="0" x2="420" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="540" y1="0" x2="540" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="660" y1="0" x2="660" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="780" y1="0" x2="780" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1020" y1="0" x2="1020" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
    <line x1="1140" y1="0" x2="1140" y2="360" />
  </g>

  <!-- Dynamic Cyber Scan Line -->
  <line class="scanLine" x1="0" y1="0" x2="1200" y2="0" stroke="url(#borderGrad)" stroke-width="2" opacity="0.6" filter="url(#glow)" />

  <!-- Outer Animated Glowing Border -->
  <rect x="2" y="2" width="1196" height="356" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" opacity="0.85" />

  <!-- Threat Intelligence Radar / Knowledge Graph Graphic (Right Side) -->
  <g id="radarTarget">
    <circle cx="1020" cy="180" r="120" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.2" />
    <circle cx="1020" cy="180" r="85" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.3" />
    <circle cx="1020" cy="180" r="50" fill="none" stroke="#7928ca" stroke-width="1.2" opacity="0.4" />
    <circle cx="1020" cy="180" r="20" fill="#00f0ff" fill-opacity="0.15" stroke="#00ffcc" stroke-width="1.5" />

    <circle class="ring1" cx="1020" cy="180" r="10" fill="none" stroke="#00f0ff" stroke-width="2" />
    <circle class="ring2" cx="1020" cy="180" r="10" fill="none" stroke="#a855f7" stroke-width="1.8" />

    <line x1="880" y1="180" x2="1160" y2="180" stroke="#00f0ff" stroke-width="0.9" stroke-dasharray="4,4" opacity="0.4" />
    <line x1="1020" y1="40" x2="1020" y2="320" stroke="#00f0ff" stroke-width="0.9" stroke-dasharray="4,4" opacity="0.4" />

    <g class="radarArm">
      <path d="M 1020 180 L 1140 180 A 120 120 0 0 0 1020 60 Z" fill="url(#radarSweep)" opacity="0.35" />
      <line x1="1020" y1="180" x2="1140" y2="180" stroke="#00f0ff" stroke-width="2" filter="url(#softGlow)" />
    </g>

    <g class="blinkingDot1" transform-origin="960 140">
      <circle cx="960" cy="140" r="5" fill="#ff0055" filter="url(#softGlow)" />
      <text x="972" y="144" fill="#ff7799" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="bold">IOC:APT41</text>
    </g>
    <g class="blinkingDot2" transform-origin="1070 230">
      <circle cx="1070" cy="230" r="4.5" fill="#00f0ff" filter="url(#softGlow)" />
      <text x="1082" y="234" fill="#67e8f9" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="bold">STIX 2.1</text>
    </g>
    <g class="blinkingDot3" transform-origin="1080 110">
      <circle cx="1080" cy="110" r="4" fill="#00ff88" filter="url(#softGlow)" />
      <text x="1092" y="114" fill="#6ee7b7" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="bold">C2_DETECT</text>
    </g>
  </g>

  <!-- Left Content / Typography -->
  <g class="floatingCard" transform="translate(60, 0)">
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="310" height="30" rx="15" fill="#0e1e38" stroke="#00f0ff" stroke-width="1.2" opacity="0.9" />
      <circle cx="15" cy="15" r="4.5" fill="#00ffaa" filter="url(#softGlow)" />
      <text x="28" y="20" fill="#38bdf8" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
        CYBER THREAT INTELLIGENCE
      </text>
    </g>

    <text x="0" y="132" fill="url(#titleGrad)" font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Threat Intelligence
    </text>
    <text x="0" y="174" fill="#ffffff" font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.3">
      Platforms (TIP) Ecosystem
    </text>

    <text x="0" y="215" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="500">
      Curated index of Enterprise SaaS Platforms &amp; Open-Source Repositories
    </text>
    <text x="0" y="240" fill="#64748b" font-family="'Segoe UI', system-ui, sans-serif" font-size="14">
      Adversary TTPs • STIX/TAXII 2.1 • IOC Enrichment • Dark Web • SecOps Workflows
    </text>

    <g transform="translate(0, 268)">
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#111d33" stroke="#2563eb" stroke-width="1" />
      <text x="12" y="18" fill="#93c5fd" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600">🛡️ 11 Enterprise SaaS</text>

      <rect x="145" y="0" width="155" height="28" rx="6" fill="#141c2e" stroke="#7c3aed" stroke-width="1" />
      <text x="157" y="18" fill="#c4b5fd" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600">⚡ 19 Open-Source Repos</text>

      <rect x="310" y="0" width="145" height="28" rx="6" fill="#0f2324" stroke="#059669" stroke-width="1" />
      <text x="322" y="18" fill="#6ee7b7" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600">📊 Valuation &amp; Stars</text>
    </g>
  </g>
</svg>
